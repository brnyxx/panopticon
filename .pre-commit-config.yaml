repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: i18n-parity
        name: i18n rule parity (ko == en)
        entry: uv run python scripts/check_i18n.py
        language: system
        pass_filenames: false
      - id: forbidden-phrases
        name: forbidden verdict phrases
        entry: uv run python scripts/check_phrases.py
        language: system
        pass_filenames: false
      - id: no-local-state
        name: refuse committing local pano state
        entry: bash -c '! git diff --cached --name-only | grep -E "^\.panopticon/|\.pano-bak-"'
        language: system
        pass_filenames: false
