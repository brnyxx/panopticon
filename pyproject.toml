[project]
name = "panopticon-mcp"
version = "0.0.1"
description = "Local-first MCP behavior observatory. We don't watch you. We watch your MCPs."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Panopticon contributors" }]
keywords = ["mcp", "model-context-protocol", "security", "sandbox", "observability"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "structlog>=24.1",
  "pydantic>=2.7",
  "jsonschema>=4.22",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "tomli>=2.0; python_version < '3.11'",
  "pyahocorasick>=2.1",
  "json5>=0.9",
  "pillow>=10.3",
  "keyring==25.7.0",
  "cryptography==50.0.1",
  "packaging>=25,<26",
  "pathspec>=1.1.1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "pytest-timeout>=2.3",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-jsonschema>=4.22",
  "types-PyYAML",
  "pre-commit>=3.7",
  "hypothesis>=6.100",
]
semantic = ["openai>=1.30"]
static = ["semgrep>=1.75"]
upstream = [
  "mcp==1.23.3",
  "openai==2.46.0",
  "platformdirs>=4.10,<5",
  "sarif-om>=1.0.4,<2",
  "semgrep==1.170.0",
  "tiktoken>=0.12,<1",
]

[project.scripts]
pano = "panopticon.cli.main:app"

[project.urls]
Homepage = "https://github.com/brnyxx/panopticon"
Documentation = "https://github.com/brnyxx/panopticon/tree/main/docs"
Issues = "https://github.com/brnyxx/panopticon/issues"
Source = "https://github.com/brnyxx/panopticon"
Changelog = "https://github.com/brnyxx/panopticon/blob/main/CHANGELOG.md"
"Security policy" = "https://github.com/brnyxx/panopticon/security/policy"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panopticon"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".gjc", ".omo", "tests/upstream"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH", "RUF", "S", "T20"]
ignore = ["S101", "S603", "S607"]
per-file-ignores = { "tests/**" = ["S", "T20"], "src/panopticon/reporters/**" = ["T20"], "src/panopticon/cli/**" = ["B008"], "scripts/**" = ["T20"] }

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/upstream"]
asyncio_mode = "auto"
timeout = 120
addopts = "-ra --strict-markers"
markers = [
  "docker: requires a container runtime (Docker or Podman)",
  "network: requires outbound network access",
  "slow: long-running",
]

[tool.coverage.run]
source = ["src/panopticon"]
branch = true

[tool.coverage.report]
# Target is 85 (panopticon-buildplan.md §22). Raised progressively as epics close; do not lower.
fail_under = 85
show_missing = true
