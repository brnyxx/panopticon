<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Panopticon eye: concentric floor-plan rings, terminal-cursor pupil -->
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#131A2E"/>
      <stop offset="100%" stop-color="#0A0E1A"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="beamL" x1="118" y1="128" x2="38" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF7A1A" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#FF7A1A" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="dotglow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bgGlow)"/>

  <!-- outer cell ring: brighter arcs -->
  <g stroke="#4A5D8C" stroke-width="6" stroke-linecap="round">
    <g id="cells">
      <path d="M128 24 A104 104 0 0 1 154.9 27.5" fill="none"/>
    </g>
    <use href="#cells" transform="rotate(30 128 128)"/>
    <use href="#cells" transform="rotate(60 128 128)"/>
    <use href="#cells" transform="rotate(90 128 128)"/>
    <use href="#cells" transform="rotate(150 128 128)"/>
    <use href="#cells" transform="rotate(180 128 128)"/>
    <use href="#cells" transform="rotate(240 128 128)"/>
    <use href="#cells" transform="rotate(300 128 128)"/>
    <use href="#cells" transform="rotate(330 128 128)"/>
  </g>
  <!-- caught cells: primary + secondary detection lights -->
  <path d="M128 24 A104 104 0 0 1 154.9 27.5" transform="rotate(270 128 128)"
        fill="none" stroke="#FF7A1A" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M128 24 A104 104 0 0 1 154.9 27.5" transform="rotate(120 128 128)"
        fill="none" stroke="#FF7A1A" stroke-width="6" stroke-linecap="round" opacity="0.7" filter="url(#glow)"/>
  <path d="M128 24 A104 104 0 0 1 154.9 27.5" transform="rotate(210 128 128)"
        fill="none" stroke="#FFB020" stroke-width="6" stroke-linecap="round" opacity="0.55" filter="url(#glow)"/>

  <!-- middle ring, brighter -->
  <circle cx="128" cy="128" r="74" stroke="#6B7EB0" stroke-width="3" fill="none" stroke-dasharray="2 10" stroke-linecap="round"/>

  <!-- detection dots on the middle ring -->
  <g filter="url(#dotglow)">
    <circle cx="182" cy="77.5" r="4" fill="#FF7A1A"/>
    <circle cx="63" cy="171" r="3.2" fill="#FFB020" opacity="0.85"/>
    <circle cx="128" cy="202" r="2.6" fill="#FF7A1A" opacity="0.7"/>
  </g>

  <!-- scan beam toward the caught cell (pointing left) -->
  <path d="M118 128 L38 108 L38 148 Z" fill="url(#beamL)"/>

  <!-- iris -->
  <circle cx="128" cy="128" r="46" stroke="#E8EDF7" stroke-width="5" fill="#0A0E1A"/>

  <!-- terminal cursor pupil -->
  <rect x="113" y="106" width="30" height="44" rx="4" fill="#FF7A1A" filter="url(#glow)"/>
</svg>
