name: release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Build, rehearse through TestPyPI, or publish every channel
        required: true
        default: build
        type: choice
        options: [build, rehearsal, production]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: uv sync --frozen --all-extras
      - run: make ci

  python-package:
    needs: quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: uv build --no-sources --out-dir release-assets
      - run: uvx --from release-assets/panopticon_mcp-1.0.0-py3-none-any.whl pano version
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: release-assets
          format: cyclonedx-json
          output-file: release-assets/python-package.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Bind SBOM to each Python artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("release-assets/python-package.cdx.json").read_bytes()
          for name in (
              "panopticon_mcp-1.0.0-py3-none-any.whl",
              "panopticon_mcp-1.0.0.tar.gz",
          ):
              Path("release-assets", name + ".cdx.json").write_bytes(source)
          Path("release-assets/python-package.cdx.json").unlink()
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-python-package
          path: release-assets/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pypi-distributions
          path: |
            release-assets/panopticon_mcp-1.0.0-py3-none-any.whl
            release-assets/panopticon_mcp-1.0.0.tar.gz

  binary:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04
            target: linux-x86_64
          - runs-on: ubuntu-24.04-arm
            target: linux-arm64
          - runs-on: macos-15-intel
            target: darwin-x86_64
          - runs-on: macos-latest
            target: darwin-arm64
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: uv sync --frozen
      - name: Build native executable once
        run: uv run --with pyinstaller==6.22.2 pyinstaller --clean --onefile --name pano --collect-all panopticon src/panopticon/cli/main.py
      - run: ./dist/pano version
      - name: Package deterministic binary archive
        env:
          PANO_TARGET: ${{ matrix.target }}
        run: uv run python scripts/package_binary.py --binary dist/pano --target "$PANO_TARGET" --output "release-assets/panopticon-1.0.0-$PANO_TARGET.tar.gz"
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          file: dist/pano
          format: cyclonedx-json
          output-file: release-assets/panopticon-1.0.0-${{ matrix.target }}.tar.gz.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.target }}
          path: release-assets/*

  assemble:
    needs: [python-package, binary]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify exact set and create hash manifest
        env:
          PANO_COMMIT: ${{ github.sha }}
        run: uv run python scripts/assemble_release.py --assets release-assets --commit "$PANO_COMMIT"
      - uses: sigstore/gh-action-sigstore-python@f7ad0af51a5648d09a20d00370f0a91c3bdf8f84
        with:
          inputs: release-assets/*
          upload-signing-artifacts: false
          release-signing-artifacts: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: panopticon-1.0.0-release-bundle
          path: release-assets/*

  draft:
    if: inputs.channel != 'build'
    needs: assemble
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: panopticon-1.0.0-release-bundle
          path: release-assets
      - name: Create or update immutable draft
        env:
          GH_TOKEN: ${{ github.token }}
          PANO_COMMIT: ${{ github.sha }}
        run: |
          if ! gh release view v1.0.0 --repo "$GITHUB_REPOSITORY"; then
            gh release create v1.0.0 --repo "$GITHUB_REPOSITORY" --draft --prerelease --target "$PANO_COMMIT" --title "Panopticon 1.0.0" --notes-file CHANGELOG.md
          fi
          gh release upload v1.0.0 --repo "$GITHUB_REPOSITORY" --clobber release-assets/*

  verify-images:
    needs: assemble
    runs-on: ubuntu-24.04
    permissions:
      packages: read
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker buildx imagetools inspect ghcr.io/brnyxx/pano-sandbox-base@sha256:0b88136f67f67f463ac1e9cc531dbe1bad7ea95d5ad5e4afd68337b966e24249
      - run: docker buildx imagetools inspect ghcr.io/brnyxx/pano-sandbox-node@sha256:2ef58b44bd9ebc247e97d1b3c54f63570ae206b925b277d86d93e5319d1cd367
      - run: docker buildx imagetools inspect ghcr.io/brnyxx/pano-sandbox-node@sha256:d0f7cc3fcac6a24ea0f8b7b9d62c542a04642ca5b38a4e249e017a7311a8b7c5
      - run: docker buildx imagetools inspect ghcr.io/brnyxx/pano-sandbox-python@sha256:3e2b99433c18506f59d0e44e40b8af2b0350ee4df903252a1ab462f0eac3f589

  testpypi:
    if: inputs.channel != 'build'
    needs: [assemble, draft]
    runs-on: ubuntu-24.04
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pypi-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist

  pypi:
    if: inputs.channel == 'production'
    needs: testpypi
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pypi-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist

  publish-github:
    if: inputs.channel == 'production'
    needs: [assemble, pypi, verify-images]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Publish the verified draft without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v1.0.0 --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
