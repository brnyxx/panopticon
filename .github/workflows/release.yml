name: release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Build, rehearse through TestPyPI, or publish every channel
        required: true
        default: build
        type: choice
        options: [build, rehearsal, production, recovery]
      source_run_id:
        description: Successful rehearsal run containing retained artifacts (production or recovery)
        required: false
        type: string
      source_sha:
        description: Exact 40-character rehearsal commit (production or recovery)
        required: false
        type: string

permissions:
  contents: read

env:
  PYTHONPATH: src

jobs:
  release-context:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.context.outputs.version }}
      tag: ${{ steps.context.outputs.tag }}
      bundle_name: ${{ steps.context.outputs.bundle_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - id: context
        run: PYTHONPATH=src python scripts/release_context.py --github-output "$GITHUB_OUTPUT"

  preflight:
    if: inputs.channel == 'production' || inputs.channel == 'recovery'
    needs: release-context
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Bind governance to the exact successful rehearsal
        run: |
          python scripts/release_preflight.py \
            --repo "${{ github.repository }}" \
            --rehearsal-run "${{ inputs.source_run_id }}" \
            --source-sha "${{ inputs.source_sha }}" \
            --twice \
            --output release-preflight.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-preflight-${{ inputs.source_run_id }}
          path: release-preflight.json

  quality:
    if: inputs.channel == 'build' || inputs.channel == 'rehearsal'
    needs: release-context
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.10.9"
      - run: uv sync --frozen --all-extras
      - run: make ci

  python-package:
    needs: [quality, release-context]
    runs-on: ubuntu-24.04
    env:
      PANO_VERSION: ${{ needs.release-context.outputs.version }}
      SOURCE_DATE_EPOCH: "315532800"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.10.9"
      - run: uv sync --frozen --extra dev
      - name: Require two clean Python builds to match
        run: |
          uv build --no-build-isolation --no-sources --out-dir release-assets
          uv build --no-build-isolation --no-sources --out-dir release-assets-repeated
          cmp \
            "release-assets/panopticon_mcp-$PANO_VERSION-py3-none-any.whl" \
            "release-assets-repeated/panopticon_mcp-$PANO_VERSION-py3-none-any.whl"
          cmp \
            "release-assets/panopticon_mcp-$PANO_VERSION.tar.gz" \
            "release-assets-repeated/panopticon_mcp-$PANO_VERSION.tar.gz"
          rm -rf release-assets-repeated
      - run: uvx --from "release-assets/panopticon_mcp-$PANO_VERSION-py3-none-any.whl" pano version
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: cyclonedx-json
          output-file: release-assets/python-package.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Bind SBOM to each Python artifact
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          source = Path("release-assets/python-package.cdx.json").read_bytes()
          for name in (
              f"panopticon_mcp-{os.environ['PANO_VERSION']}-py3-none-any.whl",
              f"panopticon_mcp-{os.environ['PANO_VERSION']}.tar.gz",
          ):
              Path("release-assets", name + ".cdx.json").write_bytes(source)
          Path("release-assets/python-package.cdx.json").unlink()
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-python-package
          path: release-assets/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pypi-distributions
          path: |
            release-assets/panopticon_mcp-${{ needs.release-context.outputs.version }}-py3-none-any.whl
            release-assets/panopticon_mcp-${{ needs.release-context.outputs.version }}.tar.gz

  binary:
    needs: [quality, release-context]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04
            target: linux-x86_64
          - runs-on: ubuntu-24.04-arm
            target: linux-arm64
          - runs-on: macos-15-intel
            target: darwin-x86_64
          - runs-on: macos-latest
            target: darwin-arm64
    runs-on: ${{ matrix.runs-on }}
    env:
      UV_MANAGED_PYTHON: "1"
      PANO_VERSION: ${{ needs.release-context.outputs.version }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.10.9"
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Build native executable once
        run: uv run --with pyinstaller==6.22.2 pyinstaller --clean --onefile --name pano --collect-all panopticon src/panopticon/cli/main.py
      - run: ./dist/pano version
      - name: Package deterministic binary archive
        env:
          PANO_TARGET: ${{ matrix.target }}
        run: uv run python scripts/package_binary.py --binary dist/pano --target "$PANO_TARGET" --version "$PANO_VERSION" --output "release-assets/panopticon-$PANO_VERSION-$PANO_TARGET.tar.gz"
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: cyclonedx-json
          output-file: release-assets/panopticon-${{ needs.release-context.outputs.version }}-${{ matrix.target }}.tar.gz.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.target }}
          path: release-assets/*

  npm-package:
    needs: [binary, release-context]
    runs-on: ubuntu-24.04
    env:
      PANO_VERSION: ${{ needs.release-context.outputs.version }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.14.0"
      - run: npm install --global npm@11.5.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          path: retained-archives
          merge-multiple: true
      - name: Assemble npm packages from retained native archives
        run: python scripts/package_npm.py --archives-dir retained-archives --output-dir npm-dist
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: cyclonedx-json
          output-file: npm-dist/npm-package.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Bind SBOM to each npm tarball
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("npm-dist/npm-package.cdx.json").read_bytes()
          for package in Path("npm-dist").glob("*.tgz"):
              package.with_name(package.name + ".cdx.json").write_bytes(source)
          Path("npm-dist/npm-package.cdx.json").unlink()
          PY
      - name: Verify scripts-disabled offline local root installation
        run: |
          npm --version
          mkdir npm-smoke
          cd npm-smoke
          npm install --ignore-scripts --offline --no-audit --no-fund \
            --omit=optional \
            "../npm-dist/brnyxx-panopticon-$PANO_VERSION.tgz" \
            "../npm-dist/brnyxx-panopticon-linux-x64-gnu-$PANO_VERSION.tgz"
          ./node_modules/.bin/pano version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-npm-package
          path: npm-dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-distributions
          path: npm-dist/*.tgz

  assemble:
    needs: [python-package, binary, npm-package, release-context]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.10.9"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify exact set and create hash manifest
        env:
          PANO_COMMIT: ${{ github.sha }}
          PANO_VERSION: ${{ needs.release-context.outputs.version }}
        run: uv run python scripts/assemble_release.py --assets release-assets --commit "$PANO_COMMIT" --version "$PANO_VERSION"
      - uses: sigstore/gh-action-sigstore-python@f7ad0af51a5648d09a20d00370f0a91c3bdf8f84
        with:
          inputs: release-assets/*
          upload-signing-artifacts: false
          release-signing-artifacts: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ needs.release-context.outputs.bundle_name }}
          path: release-assets/*

  draft:
    if: inputs.channel == 'rehearsal'
    needs: [assemble, testpypi, verify-images, release-context]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.release-context.outputs.bundle_name }}
          path: release-assets
      - name: Create immutable draft with the verified bundle
        env:
          GH_TOKEN: ${{ github.token }}
          PANO_COMMIT: ${{ github.sha }}
          PANO_TAG: ${{ needs.release-context.outputs.tag }}
          PANO_VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          if gh release view "$PANO_TAG" --repo "$GITHUB_REPOSITORY"; then
            echo "release tag already exists: $PANO_TAG" >&2
            exit 1
          fi
          gh release create "$PANO_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --draft --prerelease --target "$PANO_COMMIT" --title "Panopticon $PANO_VERSION" --notes-file CHANGELOG.md

  verify-images:
    needs: assemble
    runs-on: ubuntu-24.04
    permissions:
      packages: read
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker buildx imagetools inspect ghcr.io/brnyxx/pano-sandbox-base@sha256:0b88136f67f67f463ac1e9cc531dbe1bad7ea95d5ad5e4afd68337b966e24249
      - run: docker buildx imagetools inspect ghcr.io/brnyxx/pano-sandbox-node@sha256:2ef58b44bd9ebc247e97d1b3c54f63570ae206b925b277d86d93e5319d1cd367
      - run: docker buildx imagetools inspect ghcr.io/brnyxx/pano-sandbox-node@sha256:d0f7cc3fcac6a24ea0f8b7b9d62c542a04642ca5b38a4e249e017a7311a8b7c5
      - run: docker buildx imagetools inspect ghcr.io/brnyxx/pano-sandbox-python@sha256:3e2b99433c18506f59d0e44e40b8af2b0350ee4df903252a1ab462f0eac3f589

  testpypi:
    if: inputs.channel == 'rehearsal'
    needs: [assemble, release-context]
    runs-on: ubuntu-24.04
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pypi-distributions
          path: dist
      - name: Stage only missing exact TestPyPI files
        id: testpypi-state
        env:
          PANO_VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import urlopen
          from scripts.verify_release_recovery import stage_missing_index_assets

          version = os.environ["PANO_VERSION"]
          metadata = {}
          try:
              with urlopen(
                  f"https://test.pypi.org/pypi/panopticon-mcp/{version}/json",
                  timeout=30,
              ) as response:
                  metadata = json.loads(response.read())
          except HTTPError as error:
              if error.code != 404:
                  raise
          missing = stage_missing_index_assets(
              metadata,
              Path("dist"),
              Path("publish-dist"),
              version,
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"publish={'true' if missing else 'false'}\n")
          PY
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        if: steps.testpypi-state.outputs.publish == 'true'
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: publish-dist
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.10.9"
      - name: Verify exact TestPyPI bytes and clean install
        env:
          PANO_VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit
          from urllib.request import urlopen
          from scripts.verify_release_recovery import verify_index

          version = os.environ["PANO_VERSION"]
          with urlopen(
              f"https://test.pypi.org/pypi/panopticon-mcp/{version}/json",
              timeout=30,
          ) as response:
              metadata = json.loads(response.read())
          verify_index(metadata, Path("dist"), version)
          wheel_name = f"panopticon_mcp-{version}-py3-none-any.whl"
          wheel_urls = [
              item["url"] for item in metadata["urls"] if item.get("filename") == wheel_name
          ]
          if len(wheel_urls) != 1:
              raise ValueError("TESTPYPI_WHEEL_NOT_UNIQUE")
          parsed = urlsplit(wheel_urls[0])
          if parsed.scheme != "https" or parsed.hostname != "test-files.pythonhosted.org":
              raise ValueError("TESTPYPI_WHEEL_URL_INVALID")
          Path("testpypi-wheel-url").write_text(wheel_urls[0], encoding="utf-8")
          PY
          wheel_url=$(cat testpypi-wheel-url)
          output=$(uvx --from "$wheel_url" pano version)
          test "$output" = "pano $PANO_VERSION (schema 1.0)"

  promotion-verify:
    if: inputs.channel == 'production' || inputs.channel == 'recovery'
    needs: [preflight, release-context]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      # GitHub hides draft releases from tokens without push-equivalent access.
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Validate recovery inputs
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python - <<'PY'
          import os
          from scripts.verify_release_recovery import validate_inputs
          validate_inputs(os.environ["SOURCE_RUN_ID"], os.environ["SOURCE_SHA"])
          PY
      - name: Verify source run identity
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > run-metadata.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100" > run-jobs.json
          python - <<'PY'
          import json
          from pathlib import Path

          metadata = json.loads(Path("run-metadata.json").read_text(encoding="utf-8"))
          jobs = json.loads(Path("run-jobs.json").read_text(encoding="utf-8"))
          metadata["jobs"] = jobs["jobs"]
          Path("run-metadata.json").write_text(
              json.dumps(metadata, sort_keys=True, separators=(",", ":")),
              encoding="utf-8",
          )
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.release-context.outputs.bundle_name }}
          path: recovery-bundle
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pypi-distributions
          path: recovery-dist
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Verify retained artifacts and remote evidence
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PANO_VERSION: ${{ needs.release-context.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          python scripts/verify_release_recovery.py release-metadata --version "$PANO_VERSION" --releases releases.json --metadata draft.json --downloads draft-downloads.tsv
          mkdir draft-assets
          while IFS=$'\t' read -r asset_id asset_name; do
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "draft-assets/$asset_name"
          done < draft-downloads.tsv
          python - <<'PY'
          import os
          from pathlib import Path
          from urllib.request import urlopen
          with urlopen(
              f"https://test.pypi.org/pypi/panopticon-mcp/{os.environ['PANO_VERSION']}/json",
              timeout=30,
          ) as response:
              Path("testpypi.json").write_bytes(response.read())
          PY
          python scripts/verify_release_recovery.py source --version "$PANO_VERSION" --source-run-id "$SOURCE_RUN_ID" --source-sha "$SOURCE_SHA" --bundle recovery-bundle --dist recovery-dist --index testpypi.json --release draft.json --release-assets draft-assets --run-metadata run-metadata.json

  pypi:
    if: inputs.channel == 'production' || inputs.channel == 'recovery'
    needs: [promotion-verify, promotion-images, release-context]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.release-context.outputs.bundle_name }}
          path: recovery-bundle
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pypi-distributions
          path: dist
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Check existing PyPI release for exact idempotent reuse
        id: pypi-state
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PANO_VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import urlopen
          from scripts.verify_release_recovery import verify_bundle, verify_dist, stage_missing_index_assets
          verify_bundle(Path("recovery-bundle"), os.environ["SOURCE_SHA"], os.environ["PANO_VERSION"])
          verify_dist(Path("recovery-bundle"), Path("dist"), os.environ["PANO_VERSION"])
          metadata = {}
          try:
              with urlopen(
                  f"https://pypi.org/pypi/panopticon-mcp/{os.environ['PANO_VERSION']}/json",
                  timeout=30,
              ) as response:
                  metadata = json.loads(response.read())
          except HTTPError as error:
              if error.code != 404:
                  raise
          missing = stage_missing_index_assets(metadata, Path("dist"), Path("publish-dist"), os.environ["PANO_VERSION"])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"publish={'true' if missing else 'false'}\n")
          PY
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        if: steps.pypi-state.outputs.publish == 'true'
        with:
          packages-dir: publish-dist
      - name: Require exact PyPI hashes after publish or reuse
        env:
          PANO_VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from urllib.request import urlopen
          with urlopen(
              f"https://pypi.org/pypi/panopticon-mcp/{os.environ['PANO_VERSION']}/json",
              timeout=30,
          ) as response:
              Path("pypi-after.json").write_bytes(response.read())
          PY
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.verify_release_recovery import verify_index
          verify_index(Path("pypi-after.json"), Path("dist"), os.environ["PANO_VERSION"])
          PY

  promotion-images:
    if: inputs.channel == 'production' || inputs.channel == 'recovery'
    runs-on: ubuntu-24.04
    permissions:
      packages: read
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker buildx imagetools inspect ghcr.io/brnyxx/pano-sandbox-base@sha256:0b88136f67f67f463ac1e9cc531dbe1bad7ea95d5ad5e4afd68337b966e24249
      - run: docker buildx imagetools inspect ghcr.io/brnyxx/pano-sandbox-node@sha256:2ef58b44bd9ebc247e97d1b3c54f63570ae206b925b277d86d93e5319d1cd367
      - run: docker buildx imagetools inspect ghcr.io/brnyxx/pano-sandbox-node@sha256:d0f7cc3fcac6a24ea0f8b7b9d62c542a04642ca5b38a4e249e017a7311a8b7c5
      - run: docker buildx imagetools inspect ghcr.io/brnyxx/pano-sandbox-python@sha256:3e2b99433c18506f59d0e44e40b8af2b0350ee4df903252a1ab462f0eac3f589

  npm:
    if: inputs.channel == 'production' || inputs.channel == 'recovery'
    needs: [promotion-verify, release-context]
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.14.0"
      - run: npm install --global npm@11.5.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.release-context.outputs.bundle_name }}
          path: recovery-bundle
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-distributions
          path: npm-dist
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Re-verify retained npm artifacts
        env:
          PANO_VERSION: ${{ needs.release-context.outputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.verify_release_recovery import verify_bundle

          verify_bundle(Path("recovery-bundle"), os.environ["SOURCE_SHA"], os.environ["PANO_VERSION"])
          for tarball in Path("npm-dist").glob("*.tgz"):
              retained = Path("recovery-bundle", tarball.name)
              if not retained.is_file() or retained.read_bytes() != tarball.read_bytes():
                  raise ValueError(f"NPM_RETAINED_ARTIFACT_MISMATCH:{tarball.name}")
          PY
      - name: Publish or verify platform packages before root
        env:
          PANO_VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          test "$(node -p 'process.versions.node')" = "22.14.0"
          test "$(npm --version)" = "11.5.1"
          publish_or_verify() {
            local package="$1"
            local tarball="$2"
            local registered
            if registered=$(npm view "$package" name --json 2>npm-package.err); then
              test "$(node -e 'process.stdout.write(JSON.parse(process.argv[1]))' "$registered")" = "$package"
            elif grep -q "E404" npm-package.err; then
              echo "::error title=npm bootstrap required::NPM_PACKAGE_BOOTSTRAP_REQUIRED:$package" >&2
              exit 1
            else
              cat npm-package.err >&2
              exit 1
            fi
            local expected
            expected=$(node -e '
              const fs = require("fs");
              const crypto = require("crypto");
              process.stdout.write("sha512-" + crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"));
            ' "$tarball")
            local existing
            if existing=$(npm view "$package@$PANO_VERSION" dist.integrity --json 2>npm-view.err); then
              :
            elif grep -q "E404" npm-view.err; then
              existing=""
            else
              cat npm-view.err >&2
              exit 1
            fi
            if [ -n "$existing" ]; then
              test "$(node -e 'process.stdout.write(JSON.parse(process.argv[1]))' "$existing")" = "$expected"
            else
              npm publish "$tarball" --provenance --access public
              existing=$(npm view "$package@$PANO_VERSION" dist.integrity --json)
              test "$(node -e 'process.stdout.write(JSON.parse(process.argv[1]))' "$existing")" = "$expected"
            fi
          }
          publish_or_verify @brnyxx/panopticon-linux-x64-gnu "npm-dist/brnyxx-panopticon-linux-x64-gnu-$PANO_VERSION.tgz"
          publish_or_verify @brnyxx/panopticon-linux-arm64-gnu "npm-dist/brnyxx-panopticon-linux-arm64-gnu-$PANO_VERSION.tgz"
          publish_or_verify @brnyxx/panopticon-darwin-x64 "npm-dist/brnyxx-panopticon-darwin-x64-$PANO_VERSION.tgz"
          publish_or_verify @brnyxx/panopticon-darwin-arm64 "npm-dist/brnyxx-panopticon-darwin-arm64-$PANO_VERSION.tgz"
          publish_or_verify @brnyxx/panopticon "npm-dist/brnyxx-panopticon-$PANO_VERSION.tgz"

  publish-github:
    if: inputs.channel == 'production' || inputs.channel == 'recovery'
    needs: [pypi, npm, release-context]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.release-context.outputs.bundle_name }}
          path: recovery-bundle
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Recheck draft bytes, then release without upload
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PANO_VERSION: ${{ needs.release-context.outputs.version }}
          PANO_TAG: ${{ needs.release-context.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > run-metadata.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100" > run-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          python scripts/verify_release_recovery.py release-metadata --version "$PANO_VERSION" --releases releases.json --metadata draft.json --downloads draft-downloads.tsv
          mkdir draft-assets
          while IFS=$'\t' read -r asset_id asset_name; do
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "draft-assets/$asset_name"
          done < draft-downloads.tsv
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.verify_release_recovery import (
              validate_inputs,
              verify_bundle,
              verify_release_state,
              verify_run_jobs,
              verify_run_metadata,
          )
          validate_inputs(os.environ["SOURCE_RUN_ID"], os.environ["SOURCE_SHA"])
          metadata = json.loads(Path("run-metadata.json").read_text(encoding="utf-8"))
          jobs = json.loads(Path("run-jobs.json").read_text(encoding="utf-8"))
          metadata["jobs"] = jobs["jobs"]
          verify_run_metadata(metadata, os.environ["SOURCE_RUN_ID"], os.environ["SOURCE_SHA"])
          verify_run_jobs(metadata)
          verify_bundle(Path("recovery-bundle"), os.environ["SOURCE_SHA"], os.environ["PANO_VERSION"])
          flip = verify_release_state(json.loads(Path("draft.json").read_text()), Path("recovery-bundle"), os.environ["SOURCE_SHA"], Path("draft-assets"), os.environ["PANO_VERSION"])
          Path("flip").write_text("true" if flip else "false", encoding="utf-8")
          PY
          if [ "$(cat flip)" = "true" ]; then
            gh release edit "$PANO_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases-after.json
          python scripts/verify_release_recovery.py release-metadata --version "$PANO_VERSION" --releases releases-after.json --metadata release-after.json --downloads public-downloads.tsv
          rm -rf public-assets
          mkdir public-assets
          while IFS=$'\t' read -r asset_id asset_name; do
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "public-assets/$asset_name"
          done < public-downloads.tsv
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.verify_release_recovery import verify_release_state
          release = json.loads(Path("release-after.json").read_text())
          if verify_release_state(
              release,
              Path("recovery-bundle"),
              os.environ["SOURCE_SHA"],
              Path("public-assets"),
              os.environ["PANO_VERSION"],
          ):
              raise ValueError("RELEASE_STILL_DRAFT")
          PY
