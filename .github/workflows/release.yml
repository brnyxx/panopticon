name: release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Build, rehearse through TestPyPI, or publish every channel
        required: true
        default: build
        type: choice
        options: [build, rehearsal, production, recovery]
      source_run_id:
        description: Successful rehearsal run containing retained artifacts (recovery only)
        required: false
        type: string
      source_sha:
        description: Exact 40-character product commit (recovery only)
        required: false
        type: string

permissions:
  contents: read

jobs:
  quality:
    if: inputs.channel != 'recovery'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: uv sync --frozen --all-extras
      - run: make ci

  python-package:
    needs: quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: uv build --no-sources --out-dir release-assets
      - run: uvx --from release-assets/panopticon_mcp-1.0.0-py3-none-any.whl pano version
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: cyclonedx-json
          output-file: release-assets/python-package.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Bind SBOM to each Python artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("release-assets/python-package.cdx.json").read_bytes()
          for name in (
              "panopticon_mcp-1.0.0-py3-none-any.whl",
              "panopticon_mcp-1.0.0.tar.gz",
          ):
              Path("release-assets", name + ".cdx.json").write_bytes(source)
          Path("release-assets/python-package.cdx.json").unlink()
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-python-package
          path: release-assets/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pypi-distributions
          path: |
            release-assets/panopticon_mcp-1.0.0-py3-none-any.whl
            release-assets/panopticon_mcp-1.0.0.tar.gz

  binary:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04
            target: linux-x86_64
          - runs-on: ubuntu-24.04-arm
            target: linux-arm64
          - runs-on: macos-15-intel
            target: darwin-x86_64
          - runs-on: macos-latest
            target: darwin-arm64
    runs-on: ${{ matrix.runs-on }}
    env:
      UV_MANAGED_PYTHON: "1"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Build native executable once
        run: uv run --with pyinstaller==6.22.2 pyinstaller --clean --onefile --name pano --collect-all panopticon src/panopticon/cli/main.py
      - run: ./dist/pano version
      - name: Package deterministic binary archive
        env:
          PANO_TARGET: ${{ matrix.target }}
        run: uv run python scripts/package_binary.py --binary dist/pano --target "$PANO_TARGET" --output "release-assets/panopticon-1.0.0-$PANO_TARGET.tar.gz"
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: cyclonedx-json
          output-file: release-assets/panopticon-1.0.0-${{ matrix.target }}.tar.gz.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.target }}
          path: release-assets/*

  assemble:
    needs: [python-package, binary]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify exact set and create hash manifest
        env:
          PANO_COMMIT: ${{ github.sha }}
        run: uv run python scripts/assemble_release.py --assets release-assets --commit "$PANO_COMMIT"
      - uses: sigstore/gh-action-sigstore-python@f7ad0af51a5648d09a20d00370f0a91c3bdf8f84
        with:
          inputs: release-assets/*
          upload-signing-artifacts: false
          release-signing-artifacts: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: panopticon-1.0.0-release-bundle
          path: release-assets/*

  draft:
    if: inputs.channel != 'build'
    needs: assemble
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: panopticon-1.0.0-release-bundle
          path: release-assets
      - name: Create or update immutable draft
        env:
          GH_TOKEN: ${{ github.token }}
          PANO_COMMIT: ${{ github.sha }}
        run: |
          if ! gh release view v1.0.0 --repo "$GITHUB_REPOSITORY"; then
            gh release create v1.0.0 --repo "$GITHUB_REPOSITORY" --draft --prerelease --target "$PANO_COMMIT" --title "Panopticon 1.0.0" --notes-file CHANGELOG.md
          fi
          gh release upload v1.0.0 --repo "$GITHUB_REPOSITORY" --clobber release-assets/*

  verify-images:
    needs: assemble
    runs-on: ubuntu-24.04
    permissions:
      packages: read
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker buildx imagetools inspect ghcr.io/brnyxx/pano-sandbox-base@sha256:0b88136f67f67f463ac1e9cc531dbe1bad7ea95d5ad5e4afd68337b966e24249
      - run: docker buildx imagetools inspect ghcr.io/brnyxx/pano-sandbox-node@sha256:2ef58b44bd9ebc247e97d1b3c54f63570ae206b925b277d86d93e5319d1cd367
      - run: docker buildx imagetools inspect ghcr.io/brnyxx/pano-sandbox-node@sha256:d0f7cc3fcac6a24ea0f8b7b9d62c542a04642ca5b38a4e249e017a7311a8b7c5
      - run: docker buildx imagetools inspect ghcr.io/brnyxx/pano-sandbox-python@sha256:3e2b99433c18506f59d0e44e40b8af2b0350ee4df903252a1ab462f0eac3f589

  testpypi:
    if: inputs.channel != 'build'
    needs: [assemble, draft]
    runs-on: ubuntu-24.04
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pypi-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist

  pypi:
    if: inputs.channel == 'production'
    needs: testpypi
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pypi-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist

  publish-github:
    if: inputs.channel == 'production'
    needs: [assemble, pypi, verify-images]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Publish the verified draft without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v1.0.0 --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest

  recovery-verify:
    if: inputs.channel == 'recovery'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Validate recovery inputs
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python - <<'PY'
          import os
          from scripts.verify_release_recovery import validate_inputs
          validate_inputs(os.environ["SOURCE_RUN_ID"], os.environ["SOURCE_SHA"])
          PY
      - name: Verify source run identity
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > run-metadata.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: panopticon-1.0.0-release-bundle
          path: recovery-bundle
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pypi-distributions
          path: recovery-dist
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Verify retained artifacts and remote evidence
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from urllib.request import urlopen
          raw = subprocess.run(
              [
                  "gh", "release", "view", "v1.0.0",
                  "--repo", os.environ["GITHUB_REPOSITORY"],
                  "--json", "targetCommitish,isDraft,isPrerelease,assets",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          release = json.loads(raw)
          with urlopen(
              "https://test.pypi.org/pypi/panopticon-mcp/1.0.0/json",
              timeout=30,
          ) as response:
              Path("testpypi.json").write_bytes(response.read())
          Path("draft.json").write_text(json.dumps({"target_commitish": release["targetCommitish"], "draft": release["isDraft"], "prerelease": release["isPrerelease"], "assets": {x["name"]: x["digest"].removeprefix("sha256:") for x in release["assets"]}}), encoding="utf-8")
          PY
          gh release download v1.0.0 --repo "$GITHUB_REPOSITORY" --dir draft-assets
          python scripts/verify_release_recovery.py source --source-run-id "$SOURCE_RUN_ID" --source-sha "$SOURCE_SHA" --bundle recovery-bundle --dist recovery-dist --index testpypi.json --release draft.json --release-assets draft-assets --run-metadata run-metadata.json

  recovery-pypi:
    if: inputs.channel == 'recovery'
    needs: [recovery-verify, recovery-images]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: panopticon-1.0.0-release-bundle
          path: recovery-bundle
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pypi-distributions
          path: dist
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Check existing PyPI release for exact idempotent reuse
        id: pypi-state
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import urlopen
          from scripts.verify_release_recovery import verify_bundle, verify_dist, stage_missing_index_assets
          verify_bundle(Path("recovery-bundle"), os.environ["SOURCE_SHA"])
          verify_dist(Path("recovery-bundle"), Path("dist"))
          metadata = {}
          try:
              with urlopen(
                  "https://pypi.org/pypi/panopticon-mcp/1.0.0/json",
                  timeout=30,
              ) as response:
                  metadata = json.loads(response.read())
          except HTTPError as error:
              if error.code != 404:
                  raise
          missing = stage_missing_index_assets(metadata, Path("dist"), Path("publish-dist"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"publish={'true' if missing else 'false'}\n")
          PY
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        if: steps.pypi-state.outputs.publish == 'true'
        with:
          packages-dir: publish-dist
      - name: Require exact PyPI hashes after publish or reuse
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          with urlopen(
              "https://pypi.org/pypi/panopticon-mcp/1.0.0/json",
              timeout=30,
          ) as response:
              Path("pypi-after.json").write_bytes(response.read())
          PY
          python - <<'PY'
          from pathlib import Path
          from scripts.verify_release_recovery import verify_index
          verify_index(Path("pypi-after.json"), Path("dist"))
          PY

  recovery-images:
    if: inputs.channel == 'recovery'
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - run: docker buildx imagetools inspect ghcr.io/brnyxx/pano-sandbox-base@sha256:0b88136f67f67f463ac1e9cc531dbe1bad7ea95d5ad5e4afd68337b966e24249
      - run: docker buildx imagetools inspect ghcr.io/brnyxx/pano-sandbox-node@sha256:2ef58b44bd9ebc247e97d1b3c54f63570ae206b925b277d86d93e5319d1cd367
      - run: docker buildx imagetools inspect ghcr.io/brnyxx/pano-sandbox-node@sha256:d0f7cc3fcac6a24ea0f8b7b9d62c542a04642ca5b38a4e249e017a7311a8b7c5
      - run: docker buildx imagetools inspect ghcr.io/brnyxx/pano-sandbox-python@sha256:3e2b99433c18506f59d0e44e40b8af2b0350ee4df903252a1ab462f0eac3f589

  recovery-github:
    if: inputs.channel == 'recovery'
    needs: recovery-pypi
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: panopticon-1.0.0-release-bundle
          path: recovery-bundle
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Recheck draft bytes, then release without upload
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > run-metadata.json
          gh release download v1.0.0 --repo "$GITHUB_REPOSITORY" --dir draft-assets
          gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" --json targetCommitish,isDraft,isPrerelease,assets > release.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("release.json").read_text())
          Path("draft.json").write_text(json.dumps({"target_commitish": r["targetCommitish"], "draft": r["isDraft"], "prerelease": r["isPrerelease"], "assets": {x["name"]: x["digest"].removeprefix("sha256:") for x in r["assets"]}}), encoding="utf-8")
          PY
          python - <<'PY'
          import os, json
          from pathlib import Path
          from scripts.verify_release_recovery import validate_inputs, verify_bundle, verify_release_state, verify_run_metadata
          validate_inputs(os.environ["SOURCE_RUN_ID"], os.environ["SOURCE_SHA"])
          verify_run_metadata(json.loads(Path("run-metadata.json").read_text()), os.environ["SOURCE_RUN_ID"], os.environ["SOURCE_SHA"])
          verify_bundle(Path("recovery-bundle"), os.environ["SOURCE_SHA"])
          flip = verify_release_state(json.loads(Path("draft.json").read_text()), Path("recovery-bundle"), os.environ["SOURCE_SHA"], Path("draft-assets"))
          Path("flip").write_text("true" if flip else "false", encoding="utf-8")
          PY
          if [ "$(cat flip)" = "true" ]; then
            gh release edit v1.0.0 --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          fi
          gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" --json targetCommitish,isDraft,isPrerelease,assets > release-after.json
          rm -rf public-assets
          gh release download v1.0.0 --repo "$GITHUB_REPOSITORY" --dir public-assets
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.verify_release_recovery import verify_release_state
          release = json.loads(Path("release-after.json").read_text())
          metadata = {
              "target_commitish": release["targetCommitish"],
              "draft": release["isDraft"],
              "prerelease": release["isPrerelease"],
              "assets": {
                  asset["name"]: asset["digest"].removeprefix("sha256:")
                  for asset in release["assets"]
              },
          }
          if verify_release_state(
              metadata,
              Path("recovery-bundle"),
              os.environ["SOURCE_SHA"],
              Path("public-assets"),
          ):
              raise ValueError("RELEASE_STILL_DRAFT")
          PY
