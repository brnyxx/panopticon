name: ci
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "17 3 * * *"
permissions:
  contents: read
jobs:
  lint-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with: { version: "0.10.9" }
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy
      - run: uv run mypy --strict tests/unit/engine
      - run: uv run mypy --strict scripts/check_rules.py
      - run: uv run mypy --strict scripts/check_engine_loc.py scripts/check_no_excuse_rules.py
      - run: uv run mypy --strict scripts/release_preflight.py scripts/package_npm.py scripts/check_docs.py
      - run: uv run python scripts/check_no_excuse_rules.py tests/unit/engine scripts/check_rules.py
      - run: uv run python scripts/check_engine_loc.py  # 250 pure LOC maximum
      - run: uv run python scripts/check_docs.py
      - run: uv run python scripts/validate_schemas.py
      - run: uv run python scripts/check_i18n.py
      - run: uv run python scripts/check_phrases.py
      - run: uv run python scripts/check_rules.py
      - run: uv run python scripts/check_persistence_boundary.py
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        py: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with: { version: "0.10.9", python-version: "${{ matrix.py }}" }
      - run: uv sync --frozen --all-extras
      - run: uv run pytest -m "not docker and not network" --cov --cov-report=xml
      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        if: matrix.os == 'ubuntu-latest' && matrix.py == '3.12'
        with: { files: coverage.xml }
  test-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with: { version: "0.10.9" }
      - run: uv sync --frozen --all-extras
      - run: make images images-podman
      - name: Stage immutable images for no-pull runtime tests
        run: |
          images=(
            "debian:bookworm-slim@sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171"
            "ghcr.io/brnyxx/pano-sandbox-base:0.1@sha256:0b88136f67f67f463ac1e9cc531dbe1bad7ea95d5ad5e4afd68337b966e24249"
            "ghcr.io/brnyxx/pano-sandbox-node:20@sha256:2ef58b44bd9ebc247e97d1b3c54f63570ae206b925b277d86d93e5319d1cd367"
            "ghcr.io/brnyxx/pano-sandbox-node:22@sha256:d0f7cc3fcac6a24ea0f8b7b9d62c542a04642ca5b38a4e249e017a7311a8b7c5"
            "ghcr.io/brnyxx/pano-sandbox-python:3.12@sha256:3e2b99433c18506f59d0e44e40b8af2b0350ee4df903252a1ab462f0eac3f589"
          )
          for image in "${images[@]}"; do
            docker pull "$image"
            podman pull "$image"
          done
      - run: uv run pytest -m docker
  self-scan:
    # E16: run our own analyze line on this repository.
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: scan
        uses: ./
        with:
          path: .
          mode: standard
          sarif: pano.sarif
          fail-on: never
      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        if: always()
        with:
          sarif_file: pano.sarif
          category: panopticon-self-scan
