name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  lint-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy
      - run: uv run python scripts/validate_schemas.py
      - run: uv run python scripts/check_i18n.py
      - run: uv run python scripts/check_phrases.py
      - run: uv run python scripts/check_rules.py
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        py: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { python-version: "${{ matrix.py }}" }
      - run: uv sync --all-extras
      - run: uv run pytest -m "not docker and not network" --cov --cov-report=xml
      - uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest' && matrix.py == '3.12'
        with: { files: coverage.xml }
  test-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - run: make images
      - run: uv run pytest -m docker
  self-scan:
    # E16: run our own analyze line on this repository.
    runs-on: ubuntu-latest
    if: false  # enable when E16 closes
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - run: uv run pano scan . --mode standard --sarif > pano.sarif
      - uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: pano.sarif }
