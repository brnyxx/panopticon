name: platform-evidence

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: darwin-arm64
            runs-on: macos-14
          - label: darwin-x86_64
            runs-on: macos-15-intel
          - label: linux-amd64
            runs-on: ubuntu-24.04
          - label: linux-arm64
            runs-on: ubuntu-24.04-arm
          - label: windows-x64
            runs-on: windows-2025
          - label: wsl2-x64
            runs-on: [self-hosted, wsl2]
    runs-on: ${{ matrix.runs-on }}
    name: probe-${{ matrix.label }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - name: Install test dependencies
        run: uv sync --all-extras
      - name: Build local sandbox image
        if: startsWith(matrix.label, 'linux-')
        run: make images
      - name: Probe platform
        shell: bash
        env:
          PANO_PLATFORM_LABEL: ${{ matrix.label }}
          PANO_COMMIT: ${{ github.sha }}
        run: uv run python scripts/platform_probe.py --label "$PANO_PLATFORM_LABEL" --commit "$PANO_COMMIT" --output "evidence/$PANO_PLATFORM_LABEL.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: platform-${{ matrix.label }}
          path: evidence/${{ matrix.label }}.json
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: evidence/${{ matrix.label }}.json

  validate:
    needs: probe
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: platform-*
          path: evidence
          merge-multiple: true
      - name: Validate exact platform matrix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PANO_COMMIT: ${{ github.sha }}
          PANO_REPOSITORY: ${{ github.repository }}
        run: uv run python scripts/run_platform_matrix.py --require darwin-arm64,darwin-x86_64,linux-amd64,linux-arm64,windows-x64,wsl2-x64 --evidence-dir evidence --commit "$PANO_COMMIT" --github-repo "$PANO_REPOSITORY"
