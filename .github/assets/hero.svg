<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">How Panopticon turns one MCP call into an evidence record</title>
  <desc id="desc">A selected fixture MCP enters a generated decoy runtime and produces an evidence ledger with complete, unsupported, incomplete, and decoy-marker findings.</desc>

  <rect width="1200" height="600" fill="#010714"/>
  <rect x="20.5" y="20.5" width="1159" height="559" stroke="#1D2B43"/>
  <path d="M21 104H1179" stroke="#1D2B43"/>
  <path d="M46 579H120V576H46V579Z" fill="#6B7EB0"/>

  <g transform="translate(48 40)">
    <rect width="44" height="44" rx="10" fill="#010714"/>
    <circle cx="22" cy="22" r="16" stroke="#42587B" stroke-width="3"/>
    <circle cx="22" cy="22" r="16" stroke="#FB7C05" stroke-width="4" stroke-linecap="round"
            stroke-dasharray="10 91" transform="rotate(-52 22 22)"/>
    <circle cx="22" cy="22" r="8" fill="#071022" stroke="#F2F0ED" stroke-width="3"/>
    <rect x="18.5" y="16.5" width="7" height="11" rx="1" fill="#FB7C05"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="108" y="58" fill="#F2F0ED" font-size="18" font-weight="700" letter-spacing="5">PANOPTICON</text>
    <text x="108" y="84" fill="#AFB5C9" font-size="15">We don't watch you. We watch your MCPs.</text>
    <text x="1148" y="66" text-anchor="end" fill="#7189CD" font-size="13" font-weight="700" letter-spacing="2">LOCAL / EXPLICIT / REVERSIBLE</text>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="48" y="160" fill="#F2F0ED" font-size="44">One MCP call becomes an inspectable record.</text>
  </g>
  <text x="49" y="198" fill="#AFB5C9" font-size="18"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Select one target. Run it against generated decoys. Keep every observed and unobserved dimension visible.</text>

  <!-- Stage 1: explicit target selection -->
  <g transform="translate(48 242)">
    <rect width="258" height="274" fill="#071022" stroke="#40536E"/>
    <path d="M0 4V0H36" stroke="#6B7EB0" stroke-width="2"/>
    <text x="22" y="38" fill="#7189CD" font-size="13" font-weight="700" letter-spacing="2"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">01 / SELECT TARGET</text>
    <path d="M22 58H236" stroke="#1D2B43" stroke-dasharray="3 6"/>
    <text x="22" y="96" fill="#747E94" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">CONFIGURED MCP</text>
    <rect x="22" y="114" width="214" height="64" fill="#010714" stroke="#40536E"/>
    <circle cx="48" cy="146" r="7" stroke="#FB7C05" stroke-width="2"/>
    <circle cx="48" cy="146" r="2" fill="#FB7C05"/>
    <text x="68" y="151" fill="#F2F0ED" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">fixture-mcp</text>
    <text x="22" y="214" fill="#AFB5C9" font-size="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Exact-name selection</text>
    <text x="22" y="239" fill="#747E94" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Execution still needs approval.</text>
  </g>

  <!-- Connector 1 -->
  <g stroke="#6B7EB0" stroke-width="2">
    <path d="M320 379H350"/>
    <path d="M342 371L350 379L342 387"/>
  </g>

  <!-- Stage 2: generated decoy runtime -->
  <g transform="translate(364 242)">
    <rect width="292" height="274" fill="#071022" stroke="#40536E"/>
    <path d="M0 4V0H36" stroke="#6B7EB0" stroke-width="2"/>
    <text x="22" y="38" fill="#7189CD" font-size="13" font-weight="700" letter-spacing="2"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">02 / DECOY RUNTIME</text>
    <path d="M22 58H270" stroke="#1D2B43" stroke-dasharray="3 6"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
      <rect x="22" y="82" width="248" height="46" fill="#010714" stroke="#1D2B43"/>
      <text x="38" y="111" fill="#F2F0ED">DECOY HOME</text><text x="250" y="111" text-anchor="end" fill="#67B376">GENERATED</text>
      <rect x="22" y="136" width="248" height="46" fill="#010714" stroke="#1D2B43"/>
      <text x="38" y="165" fill="#F2F0ED">PROCESS TRACE</text><text x="250" y="165" text-anchor="end" fill="#67B376">AVAILABLE</text>
      <rect x="22" y="190" width="248" height="46" fill="#010714" stroke="#1D2B43"/>
      <text x="38" y="219" fill="#F2F0ED">NETLOG</text><text x="250" y="219" text-anchor="end" fill="#F5B52B">RECORDING</text>
    </g>
  </g>

  <!-- Connector 2 -->
  <g stroke="#6B7EB0" stroke-width="2">
    <path d="M670 379H700"/>
    <path d="M692 371L700 379L692 387"/>
  </g>

  <!-- Stage 3: evidence record -->
  <g transform="translate(714 242)">
    <rect width="438" height="274" fill="#071022" stroke="#40536E"/>
    <path d="M402 274H438V238" stroke="#FB7C05" stroke-width="2"/>
    <text x="22" y="38" fill="#7189CD" font-size="13" font-weight="700" letter-spacing="2"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">03 / EVIDENCE RECORD</text>
    <path d="M22 58H416" stroke="#1D2B43" stroke-dasharray="3 6"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
      <text x="22" y="91" fill="#AFB5C9">FILES</text><circle cx="253" cy="86" r="6" stroke="#67B376" stroke-width="2"/><text x="272" y="91" fill="#67B376">COMPLETE</text>
      <path d="M22 106H416" stroke="#1D2B43"/>
      <text x="22" y="133" fill="#AFB5C9">NETWORK</text><circle cx="253" cy="128" r="6" stroke="#67B376" stroke-width="2"/><text x="272" y="133" fill="#67B376">COMPLETE</text>
      <path d="M22 148H416" stroke="#1D2B43"/>
      <text x="22" y="175" fill="#AFB5C9">PROCESSES</text><path d="M247 180L253 168L259 180H247Z" fill="#F5B52B"/><text x="272" y="175" fill="#F5B52B">UNSUPPORTED</text>
      <path d="M22 190H416" stroke="#1D2B43"/>
      <text x="22" y="217" fill="#AFB5C9">SNAPSHOT</text><rect x="247" y="205" width="12" height="12" stroke="#FB7C05" stroke-width="2"/><text x="272" y="217" fill="#FB7C05">INCOMPLETE</text>
    </g>
    <rect x="22" y="232" width="394" height="26" fill="#010714" stroke="#F5B52B"/>
    <text x="34" y="250" fill="#F5B52B" font-size="12" font-weight="700"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">WATCH-001 / DECOY MARKER REACHED AN OUTBOUND SINK</text>
  </g>

  <text x="48" y="556" fill="#747E94" font-size="13" letter-spacing="2"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ILLUSTRATIVE FIXTURE / NOT A VERDICT</text>
  <text x="1152" y="556" text-anchor="end" fill="#F5B52B" font-size="13"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">NOT OBSERVED IS NOT A PASS.</text>
</svg>
