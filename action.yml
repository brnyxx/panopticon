name: "Panopticon"
description: "Static/semantic/dynamic analysis of an MCP server repository with SARIF output (pano scan / pano ci)."
author: "Panopticon contributors"
branding: { icon: "eye", color: "gray-dark" }
inputs:
  path:
    description: "Path to the MCP source tree"
    default: "."
  mode:
    description: "quick | standard | deep (deep needs OPENAI_API_KEY and Docker)"
    default: "standard"
  sarif:
    description: "Write SARIF to this file"
    default: "pano.sarif"
  fail-on:
    description: "Exit non-zero on: high | medium | incomplete | never"
    default: "high"
  config:
    description: "Path to panopticon.toml"
    default: "panopticon.toml"
outputs:
  sarif:
    description: "Path to the SARIF file"
    value: ${{ steps.scan.outputs.sarif }}
runs:
  using: "composite"
  steps:
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      with:
        version: "0.10.9"
    - id: scan
      shell: bash
      env:
        PANO_INPUT_PATH: ${{ inputs.path }}
        PANO_INPUT_MODE: ${{ inputs.mode }}
        PANO_INPUT_SARIF: ${{ inputs.sarif }}
        PANO_INPUT_FAIL_ON: ${{ inputs.fail-on }}
        PANO_INPUT_CONFIG: ${{ inputs.config }}
      run: |
        case "$PANO_INPUT_SARIF" in
          *$'\n'*|*$'\r'*) exit 2 ;;
        esac
        case "$PANO_INPUT_MODE" in
          quick) extras=() ;;
          standard) extras=(--extra static) ;;
          deep) extras=(--extra static --extra semantic) ;;
          *) extras=() ;;
        esac
        set +e
        uv run --directory "$GITHUB_ACTION_PATH" "${extras[@]}" pano ci "$PANO_INPUT_PATH" \
          --mode "$PANO_INPUT_MODE" \
          --sarif "$PANO_INPUT_SARIF" \
          --fail-on "$PANO_INPUT_FAIL_ON" \
          --config "$PANO_INPUT_CONFIG"
        status=$?
        set -e
        printf 'sarif=%s\n' "$PANO_INPUT_SARIF" >> "$GITHUB_OUTPUT"
        exit "$status"
